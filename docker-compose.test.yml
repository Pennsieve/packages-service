services:
  ci-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      - pennsievedb
      - minio
      - dynamodb
    environment:
      - POSTGRES_HOST=pennsievedb
      - MINIO_URL=http://minio:9000
      - DYNAMODB_URL=http://dynamodb:8000
    volumes:
      - $PWD:/go/src/github.com/pennsieve/packages-service
  pennsievedb:
    image: pennsieve/pennsievedb:V20260531120000-seed
    restart: always
  #    command: [ "postgres", "-c", "log_statement=all" ]
  minio:
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    environment:
      - MINIO_ROOT_USER=awstestkey
      - MINIO_ROOT_PASSWORD=awstestsecret
    command: server --console-address ":9001" /data
  dynamodb:
    image: amazon/dynamodb-local
    restart: always
